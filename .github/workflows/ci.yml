name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04 
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.1.2
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached venv
      uses: actions/cache@v4
      with:
        path: tests/.venv
        key: venv-tests-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    # The tests are a separate Poetry project (tests/pyproject.toml); it installs the SDK from the repository root.
    - name: Install the tests project and the SDK
      run: poetry -C tests install --no-interaction

    - name: Run tests
      run: |
        poetry -C tests run pytest -v --cov=polako.sdk --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./tests/coverage.xml
        fail_ci_if_error: false

  test-oldest-httpx:
    name: Test on the oldest supported httpx (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.1.2
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install the tests project and the SDK
      run: poetry -C tests install --no-interaction

    # The lock file has the newest httpx; the package declares httpx >= 0.25, so the floor is tested too.
    - name: Install the oldest supported httpx
      run: poetry -C tests run python -m pip install "httpx[http2]==0.25.0"

    # httpx 0.25.0 requires httpcore 0.18, so pip replaces the httpcore and h11 of the lock file: the job tests the
    # transport of the floor, not the locked one. The versions are printed and checked so that this stays visible.
    - name: Check which httpx, httpcore and h11 the tests will import
      run: |
        poetry -C tests run python -c "
        import httpx, httpcore, h11
        print('httpx', httpx.__version__, 'httpcore', httpcore.__version__, 'h11', h11.__version__)
        assert httpx.__version__ == '0.25.0', httpx.__version__
        assert httpcore.__version__.startswith('0.18'), httpcore.__version__
        "

    - name: Run tests
      run: poetry -C tests run pytest -v

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.1.2
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-3.11-${{ hashFiles('**/poetry.lock') }}
        
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
      
    - name: Install project
      run: poetry install --no-interaction
      
    - name: Run Black
      run: poetry run black --check src/ tests/
      
    - name: Run isort
      run: poetry run isort --check-only src/ tests/
      
    - name: Run flake8
      run: poetry run flake8 src/ tests/
      
    - name: Run mypy
      run: poetry run mypy src/polako/sdk/ || echo "Type checking completed with warnings"

  docs:
    name: Check documentation code blocks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.1.2
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-3.11-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install project
      run: poetry install --no-interaction

    - name: Check documentation code blocks
      run: poetry run python scripts/check_docs.py

  build:
    name: Build package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.1.2
        
    - name: Build package
      run: poetry build
      
    - name: Check package
      run: |
        poetry run pip install twine
        poetry run twine check dist/*
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
